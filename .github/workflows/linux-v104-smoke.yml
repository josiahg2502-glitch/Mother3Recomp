name: Linux v1.0.4 package smoke test

on:
  pull_request:
    paths:
      - .github/workflows/linux-v104-smoke.yml
      - test-fixtures/Mother3Recomp-v1.0.4-linux-x86_64.tar.gz
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux runtime dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgl1 libgl1-mesa-dri libsdl2-2.0-0 xvfb xauth

      - name: Verify the exact ROM-free archive
        env:
          PACKAGE: ${{ github.workspace }}/test-fixtures/Mother3Recomp-v1.0.4-linux-x86_64.tar.gz
          EXPECTED_SHA256: 053100d7365c937cbd15a395421f3eedd1afee9ea8bcedfa9fd1c02bd39705ad
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA256  $PACKAGE" | sha256sum --check
          tar -tzf "$PACKAGE" > "$RUNNER_TEMP/archive-contents.txt"
          grep -qx 'Mother3Recomp-Linux/Mother3Recomp' "$RUNNER_TEMP/archive-contents.txt"
          if grep -Eiq '(^|/)(roms?|bios)(/|$)|\.(gba|ups|ips|sav)$' "$RUNNER_TEMP/archive-contents.txt"; then
            echo 'Refusing to test an archive containing ROM, BIOS, patch, or save data' >&2
            exit 1
          fi

      - name: Verify dependencies and launch the first-run screen
        env:
          PACKAGE: ${{ github.workspace }}/test-fixtures/Mother3Recomp-v1.0.4-linux-x86_64.tar.gz
        run: |
          set -euo pipefail
          tar -xzf "$PACKAGE" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/Mother3Recomp-Linux"
          test -x ./Mother3Recomp
          ldd -r ./Mother3Recomp | tee "$RUNNER_TEMP/ldd.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/ldd.txt"
          ./Mother3Recomp --help
          ulimit -c 0
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout --signal=TERM --kill-after=5s 15s ./Mother3Recomp >"$RUNNER_TEMP/launcher.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/launcher.log"
          if [ "$status" -ne 124 ]; then
            echo "Launcher did not remain open at the first-run screen (exit $status)" >&2
            exit 1
          fi
