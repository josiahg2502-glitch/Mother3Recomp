plugins {
    id "com.android.application"
}

def gameRoot = rootDir.parentFile
def pick = { String prop, String env, File fallback ->
    def value = providers.gradleProperty(prop).orNull ?: System.getenv(env)
    return value ? new File(value) : fallback
}
def engineRoot = pick("gbarecompRoot", "GBARECOMP_ROOT", new File(gameRoot, "gbarecomp"))
def recompUiRoot = pick("recompUiRoot", "RECOMP_UI_ROOT", new File(gameRoot, "recomp-ui"))

// The same English v1.3 corpus as the desktop builds (generated/ at the repo root).
def variant = "mother3en"
def romFile = "mother3_en_v13.gba"
def romShas = [
    "306fb8874533b0fd0796208faa8bed2db4ae77fb",
    "4ffe71ce5c5e1e8d9be5fbd09968b60787169b21",
    "b875a277921ac81c3e06c5d2db930e52975aecec",
]
def title = "MOTHER 3"
def androidToml = providers.gradleProperty("gbaGameToml").orNull
    ? file(providers.gradleProperty("gbaGameToml").get())
    : new File(rootDir, "game_android_mother3en.toml")

ext.gbaGame = [
    applicationId  : "com.ylports.mother3recomp.en.dev",
    versionCode    : 108,
    versionName    : "1.0.8",
    title          : title,
    romLabel       : "MOTHER 3 ROM",
    romSha1        : romShas,
    romPatchSourceSha1: "4f0f493e12c2a8c61b2d809af03f7abf87a85776",
    romSize        : 33554432,
    romFile        : romFile,
    biosRequired   : false,
    orientation    : "landscape",
    payloadVersion : "1.0.8",
    setupNote      : "Choose a clean Japanese ROM and an IPS, IPS32, BPS, or UPS fan patch. " +
                     "The Spanish translation is supported.",
    variant        : variant,
    gameToml       : androidToml,
    // The runtime menu's font (see SDL_main), with its licence.
    payloadDirs    : [[from: file("src/main/res/font"), into: "fonts"],
                      [from: file("src/main/res/raw"), into: "fonts"]],
    gameRoot       : gameRoot,
    engineRoot     : engineRoot,
    recompUiRoot   : recompUiRoot,
    nativeJobs     : 2,
    // -Pm3Device=rg556 builds the Anbernic RG556 preset (see SDL_main).
    cmakeArguments : providers.gradleProperty("m3Device").orNull == "rg556"
                         ? ["-DMOTHER3_TUNE_RG556=ON"] : [],
    releaseAbis    : ["arm64-v8a", "x86_64"],  // x86_64 runs natively on BlueStacks and Chromebooks
    debugAbis      : ["arm64-v8a", "x86_64"],
]

apply from: new File(engineRoot, "platform/android/gbarecomp-app.gradle")

android.sourceSets.main.manifest.srcFile file("src/main/AndroidManifest.xml")
android.sourceSets.main.java.srcDir file("src/main/java")

dependencies {
    // Hoard serves cloud saves as tar.zst; zstd-jni ships the native decoders.
    // 1.5.7-12 is the newest AAR that compiles against SDK 35: later ones
    // declare minCompileSdk=37, which AGP 8.10 (compileSdk 35) refuses.
    implementation "com.github.luben:zstd-jni:1.5.7-12@aar"
}
